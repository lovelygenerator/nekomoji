[workspace]
members = ["crates/nekomoji", "crates/nekomoji-cli", "crates/nekomoji-wgpu", "examples/web-demo"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"
repository = "https://github.com/lovelygenerator/nekomoji"
homepage = "https://github.com/lovelygenerator/nekomoji"

[workspace.dependencies]
nekomoji = { path = "crates/nekomoji", version = "0.1.1" }
