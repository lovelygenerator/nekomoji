[package]
name = "nekomoji-wgpu"
description = "wgpu rendering adapter for nekomoji (dynamic glyph atlas, instanced quads)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nekomoji-wgpu"
readme = "README.md"
keywords = ["japanese", "wgpu", "text-rendering", "gamedev", "nekomoji"]
categories = ["rendering", "game-development", "graphics"]
# wgpu 30 の要求に合わせる(コアの MSRV 1.75 とは別)
rust-version = "1.87"
# 同梱しない: tests と examples は、リポジトリのフォントや絵(assets/・examples/)を使うため
exclude = ["tests/*", "examples/*"]

[dependencies]
nekomoji = { workspace = true }
fontdue = "0.9"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
# 縦書きの字形の置き換え(GSUB の vert/vrt2)と仮名の詰め(GPOS の palt/vpal)を読むだけに使う。fontdue も同じ版に依存している
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout"] }

[dev-dependencies]
winit = "0.30"
pollster = "1"
# examples(snapshot・viewer)の `--icon` で PNG の絵を読むだけに使う(ライブラリには入らない)
png = "0.17"
